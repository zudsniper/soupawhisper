[project]
name = "soupawhisper"
version = "0.2.0"
description = "Push-to-talk voice dictation for Linux (X11 + Wayland) using faster-whisper"
authors = [{ name = "Kyle", email = "kyle@ksred.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["whisper", "dictation", "voice", "transcription", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# PyGObject (gi) and evdev come from the system packages python3-gi and
# python3-evdev; the venv is created with --system-site-packages.
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy",
    "av<16",  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 16+
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.urls]
Repository = "https://github.com/zudsniper/soupawhisper"

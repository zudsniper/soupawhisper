[whisper]
# Model: tiny.en, base.en, small.en, medium.en, large-v3, large-v3-turbo
model = large-v3-turbo

# Device: cuda or cpu. If cuda fails to load, small.en on CPU is used instead.
device = cuda

# Compute type: float16 for GPU, int8 for CPU
compute_type = float16

# Spoken language (e.g. en, de). Leave empty to auto-detect.
language = en

beam_size = 5

[hotkey]
# Key to hold while speaking: rightctrl, rightalt, f12, scrolllock, pause, ...
# (any evdev KEY_* name, lowercase without the KEY_ prefix)
key = rightctrl

# Presses shorter than this (seconds) are ignored, and pressing any other key
# while holding the hotkey (e.g. Ctrl+C) cancels, so shortcuts still work.
min_hold = 0.25

[behavior]
# Type text into the focused input field (via a uinput virtual keyboard)
auto_type = true

# Type a space after each dictation so consecutive ones don't run together
trailing_space = true

# Delay between typed keys in milliseconds
type_delay_ms = 4

# Desktop notifications (the overlay already shows status)
notifications = false

[overlay]
# On-screen listening/transcribing indicator
enabled = true

# top or bottom of the primary monitor, and distance from that edge in px
position = bottom
offset = 72
